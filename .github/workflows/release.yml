name: release
on:
  push:
    tags: ["v*"]
env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
permissions:
  contents: write
jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p qm-app -p qm-cli -p qm-bench
      - name: Fetch models
        shell: bash
        run: |
          sh scripts/fetch_models.sh
          sh scripts/fetch_models_fastenhancer.sh
          sh scripts/fetch_models_dpdfnet.sh
      - name: Package
        shell: bash
        run: sh scripts/package_windows.sh
      - name: Build MSI
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          VERSION="${GITHUB_REF_NAME#v}"
          wix build scripts/installer/QuietMic.wxs -d Version="$VERSION" -d Src=dist/QuietMic -arch x64 -o "dist/QuietMic-$VERSION-x64.msi"
          ls -la dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/QuietMic-$VERSION-x64.msi" --title "QuietMic $VERSION" --notes "Windows installer (per-user, no admin). Install the free VB-Cable virtual audio driver separately: https://vb-audio.com/Cable/. First release; not yet tested on a live Windows machine."
