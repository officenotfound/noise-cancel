name: build
on:
  workflow_dispatch:
env:
  # Faster CI builds: tract compiles slowly with fat LTO, and it gains little there.
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p qm-app -p qm-cli -p qm-bench
      - name: Test
        run: cargo test --release -p qm-dsp -p qm-engine -p qm-audio -p qm-app
      - name: Fetch models
        shell: bash
        run: |
          sh scripts/fetch_models.sh
          sh scripts/fetch_models_fastenhancer.sh
          sh scripts/fetch_models_dpdfnet.sh
      - name: Package
        shell: bash
        run: sh scripts/package_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuietMic-windows
          path: dist/QuietMic
          retention-days: 14
      - name: Installer (Inno Setup)
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" scripts/installer/QuietMic.iss
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: QuietMic-Setup
          path: dist/QuietMic-Setup.exe
          retention-days: 14
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p qm-dsp -p qm-engine -p qm-audio -p qm-app
      - name: Fetch models
        run: |
          sh scripts/fetch_models.sh
          sh scripts/fetch_models_fastenhancer.sh
          sh scripts/fetch_models_dpdfnet.sh
      - name: Package (.app and .dmg)
        run: sh scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuietMic-macOS
          path: dist/QuietMic-macOS.dmg
          retention-days: 14
