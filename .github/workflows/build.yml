name: build
on:
  push:
  workflow_dispatch:
jobs:
  windows-bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p qm-bench
      - run: cargo test --release -p qm-dsp
      - uses: actions/upload-artifact@v4
        with:
          name: qm-bench-windows
          path: target/release/qm-bench.exe
