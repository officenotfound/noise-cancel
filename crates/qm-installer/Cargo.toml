[package]
name = "qm-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "QuietMic-Setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.18"

[build-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
