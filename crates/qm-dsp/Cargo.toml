[package]
name = "qm-dsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
ndarray = "0.15"
nnnoiseless = { version = "0.5", default-features = false }
# crates.io `deep_filter` has no model runtime; the tract runtime only exists in the git repo.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract"] }
# libDF's tract.rs was written against tract 0.21.4; later 0.21.x releases changed the API (symbol_table, etc.).
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
