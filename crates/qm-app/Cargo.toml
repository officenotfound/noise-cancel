[package]
name = "qm-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "QuietMic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
qm-engine = { path = "../qm-engine" }
qm-dsp = { path = "../qm-dsp" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
qm-win = { path = "../qm-win" }
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
hound = "3.5"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
