[package]
name = "qm-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "QuietMic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
qm-engine = { path = "../qm-engine" }
qm-dsp = { path = "../qm-dsp" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
png = "0.18"
hound = "3.5"
qm-audio = { path = "../qm-audio" }
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
